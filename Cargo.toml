[package]
name = "treiber_stack"
version = "1.2.0"
edition = "2024"
authors = ["Tim Boudreau <tim@timboudreau.com>"]
license = "MIT"
description = "A lockless, thread-safe, atomic linked-list."
readme = "README.md"
homepage = "https://github.com/timboudreau/treiber_stack"
repository = "https://github.com/timboudreau/treiber_stack.git"
keywords = ["lockless", "stack", "treiber", "concurrent"]
categories = ["concurrency"]

[lib]
name = "treiber_stack"
path = "src/lib.rs"

[features]
default = [ "stack", "queue" ]
queue = [ "dep:portable-atomic" ]
queue-stats = [ "queue" ]
stack = [ "dep:arc-swap" ]
queue-read-relaxed = [ "queue" ]

[dependencies]
arc-swap = { version = "1.9.2", optional = true }
portable-atomic = { version = "1.15.0", optional = true }

[dev-dependencies]
backtrace-on-stack-overflow = "0.3.0"
portable-atomic = { version = "1.15.0" }
